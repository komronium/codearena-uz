# Production overlay: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  db:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  web:
    restart: unless-stopped
    ports: !override []
    volumes: !override
      - "media:/app/media"
      - "/run/codearena:/run/codearena"
    # Single line on purpose: a YAML folded block keeps newlines for indented
    # continuation lines, and `sh -c` would then run gunicorn without its flags.
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind unix:/run/codearena/gunicorn.sock --umask 007 --group www-data --workers ${WEB_WORKERS:-3} --worker-class gthread --threads ${WEB_THREADS:-8} --timeout 60"

  worker:
    restart: unless-stopped
    # Each judge worker runs one submission at a time; N of them judge N in parallel. It starts once
    # web has applied the migrations (they start together on a deploy), and exec hands it compose's
    # stop signal, so a judging in progress finishes.
    command: sh -c "until python manage.py migrate --check >/dev/null 2>&1; do sleep 5; done; exec python manage.py rqworker-pool default run rejudge --num-workers ${JUDGE_WORKERS:-4}"
    volumes: !override
      - "media:/app/media"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/var/codearena/work:/var/codearena/work"

  # Replaces host crontab: points and difficulty sweeps every 5 minutes (idempotent), and the similarity
  # check of every problem of a round once it has ended (flag_similarity --pending; it only flags, staff
  # decide). Rating is applied by staff (Boshqaruv -> Musobaqalar) after reviewing the flags; it is never
  # swept automatically.
  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - "media:/app/media"
    depends_on: [db, redis]
    networks:
      - codearena-net
    # waits, like the worker, until web has applied the migrations
    command: >
      sh -c "until python manage.py migrate --check >/dev/null 2>&1; do sleep 5; done;
             while true; do
               python manage.py recalc_points;
               python manage.py recalc_difficulty;
               python manage.py flag_similarity --pending;
               python manage.py telegram_notifications;
             sleep 300;
             done"

  notification-worker:
    restart: unless-stopped
    volumes: !override
      - "media:/app/media"
    command: sh -c "until python manage.py migrate --check >/dev/null 2>&1; do sleep 5; done; exec python manage.py rqworker notifications"

volumes:
  media:
