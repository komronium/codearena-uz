# Production overlay: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  db:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  web:
    restart: unless-stopped
    ports: !override ["2009:8000"]
    volumes: !override
      - "media:/app/media"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"

  worker:
    restart: unless-stopped
    volumes: !override
      - "media:/app/media"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/var/codearena/work:/var/codearena/work"

  # Replaces host crontab: rating + similarity sweeps every 5 minutes (both idempotent).
  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - "media:/app/media"
    depends_on: [db, redis]
    networks:
      - codearena-net
    command: >
      sh -c "while true; do
               python manage.py recalc_rating;
               python manage.py flag_similarity;
               sleep 300;
             done"

volumes:
  media:
