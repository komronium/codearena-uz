{% extends "base.html" %}
{% block title %}Kontestlar{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Kontestlar</h1>
<table class="w-full bg-white rounded shadow">
  <tr class="text-left border-b"><th class="p-2">Nomi</th><th class="p-2">Boshlanishi</th><th class="p-2">Tugashi</th><th class="p-2">Turi</th></tr>
  {% for c in contests %}
  <tr class="border-b"><td class="p-2"><a class="text-blue-600" href="{% url 'contests:detail' c.pk %}">{{ c.title }}</a></td>
    <td class="p-2">{{ c.start|date:"d.m H:i" }}</td><td class="p-2">{{ c.end|date:"d.m H:i" }}</td>
    <td class="p-2">{{ c.get_type_display }}</td></tr>
  {% endfor %}
</table>
{% endblock %}
