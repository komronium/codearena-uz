{% comment %}Auth input with leading icon; password fields get a show/hide toggle.
  ctx: name, label, type, icon, autocomplete, value, errors, hint, autofocus, optional{% endcomment %}
<div>
  <label class="ca-label" for="id_{{ name }}">{{ label }}</label>
  <div class="ca-auth-field">
    <i data-lucide="{{ icon }}" class="lu" aria-hidden="true"></i>
    <input class="ca-input" type="{{ type }}" name="{{ name }}" id="id_{{ name }}" value="{{ value|default:'' }}"
           autocomplete="{{ autocomplete }}" {% if name == 'username' or type == 'email' %}spellcheck="false" autocapitalize="none"{% endif %} {% if not optional %}required{% endif %} {% if autofocus %}autofocus{% endif %}
           {% if errors %}aria-invalid="true" aria-describedby="err_{{ name }}"{% elif hint %}aria-describedby="hint_{{ name }}"{% endif %}>
    {% if type == 'password' %}
    <button type="button" class="ca-auth-eye" data-toggle-password="id_{{ name }}" aria-label="Parolni ko‘rsatish" aria-pressed="false">
      <i data-lucide="eye" class="lu" aria-hidden="true"></i>
    </button>
    {% endif %}
  </div>
  {% if errors %}<p id="err_{{ name }}" class="mt-1.5 flex items-start gap-1 text-sm text-bad"><i data-lucide="circle-alert" class="lu mt-0.5 shrink-0" aria-hidden="true"></i>{{ errors.0 }}</p>
  {% elif hint %}<p id="hint_{{ name }}" class="mt-1.5 text-xs text-mute">{{ hint }}</p>{% endif %}
</div>
