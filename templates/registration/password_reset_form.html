{% extends "base.html" %}
{% block title %}Parolni tiklash{% endblock %}
{% block content %}
<div class="mx-auto max-w-sm">
  <h1 class="mb-1 text-2xl font-semibold tracking-tight">Parolni tiklash</h1>
  <p class="mb-6 text-sm text-mute">Emailingizni kiriting — parolni tiklash havolasini yuboramiz.</p>
  <form method="post" class="ca-panel space-y-4">{% csrf_token %}
    <div>
      <label class="ca-label" for="id_email">Email</label>
      <input class="ca-input" type="email" name="email" id="id_email" autocomplete="email" required autofocus>
      {% if form.email.errors %}<p class="mt-1 text-sm text-bad">{{ form.email.errors.0 }}</p>{% endif %}
    </div>
    <button type="submit" class="ca-btn ca-btn-primary w-full">Havola yuborish</button>
  </form>
  <p class="mt-4 text-center text-sm text-mute">
    <a class="ca-link" href="{% url 'login' %}">Kirishga qaytish</a>
  </p>
</div>
{% endblock %}
