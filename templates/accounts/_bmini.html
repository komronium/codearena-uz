{% comment %}A badge small, for lists: the family's icon on a little tile in its level's metal; the name on hover.
ctx: b (with icon, tier, title).{% endcomment %}<span class="ca-bmini ca-t{{ b.tier }}" title="{{ b.title }}" role="img" aria-label="{{ b.title }}"><i data-lucide="{{ b.icon }}" class="lu" aria-hidden="true"></i></span>
