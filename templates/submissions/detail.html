{% extends "base.html" %}
{% block title %}Yuborma #{{ s.pk }}{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-2">Yuborma #{{ s.pk }} — <a class="text-blue-600" href="{% url 'problems:detail' s.problem.slug %}">{{ s.problem.title }}</a></h1>
<p class="text-sm text-gray-500 mb-4">{{ s.language.name }} · {{ s.created }}</p>
<div id="status" hx-get="{% url 'submissions:status' s.pk %}" hx-trigger="load">{% include "submissions/_status.html" with results=s.results.all %}</div>
<h2 class="text-lg font-semibold mt-6 mb-2">Kod</h2>
<pre class="bg-gray-900 text-gray-100 p-4 rounded overflow-x-auto text-sm">{{ s.source }}</pre>
{% endblock %}
