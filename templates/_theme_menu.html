{% comment %}The theme menu beside the search, for guests and members alike: follow the device, or pin light or
dark. base.html keeps the choice in localStorage, swaps the button's icon and closes the menu on a pick.{% endcomment %}
<details class="ca-dropdown ca-theme-menu" data-dropdown>
  <summary id="theme-toggle" class="ca-icon-btn" aria-label="{% trans 'Ko‘rinish: tizim, kunduzgi yoki tungi' %}" title="{% trans 'Ko‘rinish' %}"><i data-lucide="sun-moon" class="lu" aria-hidden="true"></i></summary>
  <div class="ca-dropdown-panel ca-theme-panel" role="group" aria-label="{% trans 'Ko‘rinish' %}">
    <button type="button" class="ca-dropdown-item" data-theme-set="system" aria-pressed="false"><i data-lucide="monitor" class="lu" aria-hidden="true"></i><span>{% trans "Tizim bo‘yicha<small>qurilma sozlamasiga ergashadi</small>" %}</span></button>
    <button type="button" class="ca-dropdown-item" data-theme-set="light" aria-pressed="false"><i data-lucide="sun" class="lu" aria-hidden="true"></i><span>{% trans "Kunduzgi" %}</span></button>
    <button type="button" class="ca-dropdown-item" data-theme-set="dark" aria-pressed="false"><i data-lucide="moon" class="lu" aria-hidden="true"></i><span>{% trans "Tungi" %}</span></button>
  </div>
</details>
