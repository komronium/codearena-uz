<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Server xatosi — CodeArena</title>
  <style>
    :root { color-scheme: light dark; --bg: #F5F6FA; --ink: #14171F; --mute: #646B7A; --accent: #4F46E5; --on: #fff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0C0E14; --ink: #E8EAF0; --mute: #9CA4B7; --accent: #A5ADFA; --on: #11131C; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem; background: var(--bg); color: var(--ink);
      font-family: ui-sans-serif, system-ui, sans-serif; text-align: center; }
    .code { font-size: 3.75rem; font-weight: 700; color: var(--accent); margin: 0; font-variant-numeric: tabular-nums; }
    h1 { font-size: 1.6rem; margin: 1rem 0 .5rem; letter-spacing: -.02em; }
    p { color: var(--mute); max-width: 26rem; margin: 0 auto; line-height: 1.5; }
    a { display: inline-block; margin-top: 1.5rem; padding: .6rem 1rem; border-radius: 10px; background: var(--accent); color: var(--on);
      font-weight: 600; text-decoration: none; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">500</p>
    <h1>Serverda xatolik</h1>
    <p>Kutilmagan xato yuz berdi. Bir necha soniyadan so‘ng sahifani yangilang.</p>
    <a href="/">Bosh sahifaga</a>
  </main>
</body>
</html>
