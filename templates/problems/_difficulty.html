{% comment %}A problem's difficulty, after LeetCode: its level as a coloured word (Beginner, Easy, Medium, Hard), then its
rating, at which half of those who try it solve it (apps.problems.difficulty). Needs `p`.{% endcomment %}
<span class="whitespace-nowrap" title="{{ p.get_difficulty_display }}, reyting {{ p.rating }}"><span class="ca-diff ca-diff-{{ p.difficulty }}">{{ p.get_difficulty_display }}</span><span class="ca-rt tabular">{{ p.rating }}</span></span>
