{% extends "base.html" %}
{% block title %}Viktorina{% endblock %}
{% block content %}
<div class="ca-quiz ca-live-phone" data-nocopy>
  <div id="live-panel" aria-live="polite"></div>
</div>
<script>
(() => {
  const panel = document.getElementById("live-panel");
  let v = null, endAt = 0;
  const csrf = "{{ csrf_token }}";
  const answer = async (index, given) => {
    panel.querySelectorAll("button").forEach((b) => (b.disabled = true));
    try { await fetch("{{ answer_url }}", { method: "POST", headers: { "X-CSRFToken": csrf }, body: new URLSearchParams({ index, answer: given }) }); } catch {}
    poll();
  };
  const poll = async () => {
    try {
      const r = await fetch("{{ state_url }}", { credentials: "same-origin" }); if (!r.ok) return; const d = await r.json();
      if (d.v !== v) { v = d.v; panel.innerHTML = d.html; if (window.caIcons) window.caIcons(); }
      endAt = d.ms != null ? performance.now() + d.ms : 0;
    } catch {}
  };
  panel.addEventListener("click", (e) => { const b = e.target.closest("[data-pick]"); if (b) answer(b.dataset.index, b.dataset.pick); });
  panel.addEventListener("submit", (e) => { const f = e.target.closest("[data-type]"); if (f) { e.preventDefault(); answer(f.dataset.index, f.elements.answer.value); } });
  setInterval(poll, 1200); poll();
  setInterval(() => { const s = panel.querySelector("[data-secs]"); if (s && endAt) s.textContent = Math.ceil(Math.max(0, endAt - performance.now()) / 1000); }, 250);
})();
</script>
{% endblock %}
