{% comment %}Staff pages: one row of tabs under the rail's single "Admin" entry.{% endcomment %}
{% with ns=request.resolver_match.namespace un=request.resolver_match.url_name %}
<nav class="ca-tabs ca-tabs-scroll mb-6" aria-label="Boshqaruv bo‘limlari">
  <a class="ca-tab{% if ns == 'moderation' and un == 'dashboard' %} is-active{% endif %}" href="{% url 'moderation:dashboard' %}"><i data-lucide="layout-dashboard" class="lu" aria-hidden="true"></i>Boshqaruv</a>
  <a class="ca-tab{% if ns == 'moderation' and un in 'problems,submit,problem_edit,ai_generate' %} is-active{% endif %}" href="{% url 'moderation:problems' %}"><i data-lucide="file-code-2" class="lu" aria-hidden="true"></i>Masalalar</a>
  <a class="ca-tab{% if ns == 'moderation' and un == 'queue' %} is-active{% endif %}" href="{% url 'moderation:queue' %}"><i data-lucide="inbox" class="lu" aria-hidden="true"></i>Navbat</a>
  <a class="ca-tab{% if ns == 'moderation' and un in 'contests,contest_new,contest_edit' %} is-active{% endif %}" href="{% url 'moderation:contests' %}"><i data-lucide="trophy" class="lu" aria-hidden="true"></i>Musobaqalar</a>
  <a class="ca-tab{% if ns == 'moderation' and un == 'submissions' %} is-active{% endif %}" href="{% url 'moderation:submissions' %}"><i data-lucide="history" class="lu" aria-hidden="true"></i>Urinishlar</a>
  <a class="ca-tab{% if ns == 'moderation' and un in 'users,user_edit' %} is-active{% endif %}" href="{% url 'moderation:users' %}"><i data-lucide="users-round" class="lu" aria-hidden="true"></i>Foydalanuvchilar</a>
  <a class="ca-tab{% if ns == 'moderation' and un in 'groups,group_new,group_edit' %} is-active{% endif %}" href="{% url 'moderation:groups' %}"><i data-lucide="school" class="lu" aria-hidden="true"></i>Guruhlar</a>
  <a class="ca-tab{% if ns == 'moderation' and un == 'tags' %} is-active{% endif %}" href="{% url 'moderation:tags' %}"><i data-lucide="tags" class="lu" aria-hidden="true"></i>Mavzular</a>
  <a class="ca-tab{% if ns == 'integrity' and un == 'audit' %} is-active{% endif %}" href="{% url 'integrity:audit' %}"><i data-lucide="scroll-text" class="lu" aria-hidden="true"></i>Jurnal</a>
</nav>
{% endwith %}
